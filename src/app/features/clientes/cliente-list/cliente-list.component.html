<div class="cliente-list-container">
  <mat-card>
    <mat-card-header>
      <div class="header-content">
        <div class="title-section">
          <mat-icon class="title-icon">people</mat-icon>
          <h1>Clientes</h1>
        </div>
        <button 
          mat-raised-button 
          color="primary" 
          (click)="openCreateDialog()">
          <mat-icon>add</mat-icon>
          Nuevo Cliente
        </button>
      </div>
    </mat-card-header>

    <mat-card-content>
      <!-- Buscador -->
      <mat-form-field appearance="outline" class="search-field">
        <mat-label>Buscar cliente</mat-label>
        <input 
          matInput 
          [formControl]="searchControl"
          placeholder="Nombre, teléfono, email o DPI">
        <mat-icon matPrefix>search</mat-icon>
      </mat-form-field>

      <!-- Loading spinner -->
      <div class="loading-container" *ngIf="loading()">
        <mat-spinner></mat-spinner>
      </div>

      <!-- Tabla -->
      <div class="table-container" *ngIf="!loading()">
        <table mat-table [dataSource]="displayedClientes()" class="cliente-table">
          <!-- Nombre Column -->
          <ng-container matColumnDef="nombreCompleto">
            <th mat-header-cell *matHeaderCellDef>Nombre</th>
            <td mat-cell *matCellDef="let cliente">
              <div class="client-name">
                <mat-icon class="client-icon">person</mat-icon>
                {{ cliente.nombreCompleto }}
              </div>
            </td>
          </ng-container>

          <!-- Teléfono Column -->
          <ng-container matColumnDef="telefono">
            <th mat-header-cell *matHeaderCellDef>Teléfono</th>
            <td mat-cell *matCellDef="let cliente">
              <div class="contact-info">
                <mat-icon>phone</mat-icon>
                {{ cliente.telefono || '-' }}
              </div>
            </td>
          </ng-container>

          <!-- Email Column -->
          <ng-container matColumnDef="email">
            <th mat-header-cell *matHeaderCellDef>Email</th>
            <td mat-cell *matCellDef="let cliente">
              <div class="contact-info">
                <mat-icon>email</mat-icon>
                {{ cliente.email || '-' }}
              </div>
            </td>
          </ng-container>

          <!-- Ciudad Column -->
          <ng-container matColumnDef="ciudad">
            <th mat-header-cell *matHeaderCellDef>Ciudad</th>
            <td mat-cell *matCellDef="let cliente">{{ cliente.ciudad || '-' }}</td>
          </ng-container>

          <!-- DPI Column -->
          <ng-container matColumnDef="dpi">
            <th mat-header-cell *matHeaderCellDef>DPI</th>
            <td mat-cell *matCellDef="let cliente">{{ cliente.dpi || '-' }}</td>
          </ng-container>

          <!-- Acciones Column -->
          <ng-container matColumnDef="acciones">
            <th mat-header-cell *matHeaderCellDef>Acciones</th>
            <td mat-cell *matCellDef="let cliente">
              <button 
                mat-icon-button 
                color="primary"
                (click)="openEditDialog(cliente)"
                matTooltip="Editar">
                <mat-icon>edit</mat-icon>
              </button>
              <button 
                mat-icon-button 
                color="warn"
                (click)="deleteCliente(cliente)"
                matTooltip="Eliminar">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

          <!-- No data row -->
          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell no-data" [attr.colspan]="displayedColumns.length">
              <div class="no-data-message">
                <mat-icon>info</mat-icon>
                <p>No se encontraron clientes</p>
              </div>
            </td>
          </tr>
        </table>

        <!-- Paginador -->
        <mat-paginator 
          [length]="totalItems"
          [pageSize]="pageSize"
          [pageSizeOptions]="[5, 10, 25, 50]"
          (page)="onPageChange($event)"
          showFirstLastButtons>
        </mat-paginator>
      </div>
    </mat-card-content>
  </mat-card>
</div>
