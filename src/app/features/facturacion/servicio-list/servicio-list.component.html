<div class="servicio-list-container">
  <mat-card>
    <mat-card-header>
      <div class="header-content">
        <div class="title-section">
          <mat-icon class="title-icon">medical_services</mat-icon>
          <h1>Servicios</h1>
        </div>
        <button 
          mat-raised-button 
          color="primary" 
          (click)="openCreateDialog()">
          <mat-icon>add</mat-icon>
          Nuevo Servicio
        </button>
      </div>
    </mat-card-header>

    <mat-card-content>
      <!-- Buscador -->
      <mat-form-field appearance="outline" class="search-field">
        <mat-label>Buscar servicio</mat-label>
        <input 
          matInput 
          [formControl]="searchControl"
          placeholder="Nombre o categoría">
        <mat-icon matPrefix>search</mat-icon>
      </mat-form-field>

      <!-- Loading spinner -->
      <div class="loading-container" *ngIf="loading()">
        <mat-spinner></mat-spinner>
      </div>

      <!-- Tabla -->
      <div class="table-container" *ngIf="!loading()">
        <table mat-table [dataSource]="displayedServicios()" class="servicio-table">
          <!-- Nombre Column -->
          <ng-container matColumnDef="nombre">
            <th mat-header-cell *matHeaderCellDef>Nombre</th>
            <td mat-cell *matCellDef="let servicio">
              <div class="servicio-name">
                <mat-icon class="servicio-icon">room_service</mat-icon>
                {{ servicio.nombre }}
              </div>
            </td>
          </ng-container>

          <!-- Categoría Column -->
          <ng-container matColumnDef="categoria">
            <th mat-header-cell *matHeaderCellDef>Categoría</th>
            <td mat-cell *matCellDef="let servicio">
              <mat-chip-set *ngIf="servicio.categoria">
                <mat-chip class="chip-categoria">{{ servicio.categoria }}</mat-chip>
              </mat-chip-set>
              <span *ngIf="!servicio.categoria">-</span>
            </td>
          </ng-container>

          <!-- Precio Column -->
          <ng-container matColumnDef="precio">
            <th mat-header-cell *matHeaderCellDef>Precio</th>
            <td mat-cell *matCellDef="let servicio" class="precio-cell">
              {{ servicio.precio | moneda }}
            </td>
          </ng-container>

          <!-- Estado Column -->
          <ng-container matColumnDef="estado">
            <th mat-header-cell *matHeaderCellDef>Estado</th>
            <td mat-cell *matCellDef="let servicio">
              <mat-chip-set>
                <mat-chip [class.chip-activo]="servicio.activo" [class.chip-inactivo]="!servicio.activo">
                  {{ servicio.activo ? 'Activo' : 'Inactivo' }}
                </mat-chip>
              </mat-chip-set>
            </td>
          </ng-container>

          <!-- Acciones Column -->
          <ng-container matColumnDef="acciones">
            <th mat-header-cell *matHeaderCellDef>Acciones</th>
            <td mat-cell *matCellDef="let servicio">
              <button 
                mat-icon-button 
                color="primary" 
                (click)="openEditDialog(servicio)"
                matTooltip="Editar">
                <mat-icon>edit</mat-icon>
              </button>
              <button 
                mat-icon-button 
                color="warn" 
                (click)="deleteServicio(servicio)"
                matTooltip="Eliminar">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

          <!-- No data row -->
          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell no-data-cell" [attr.colspan]="displayedColumns.length">
              <div class="no-data">
                <mat-icon>medical_services</mat-icon>
                <p>No se encontraron servicios</p>
              </div>
            </td>
          </tr>
        </table>

        <!-- Paginador -->
        <mat-paginator
          [length]="totalItems"
          [pageSize]="pageSize"
          [pageSizeOptions]="[5, 10, 25, 50]"
          (page)="onPageChange($event)"
          showFirstLastButtons>
        </mat-paginator>
      </div>
    </mat-card-content>
  </mat-card>
</div>
