<div class="servicio-form-container">
  <h2 mat-dialog-title>
    <mat-icon>{{ isEditMode ? 'edit' : 'add' }}</mat-icon>
    {{ isEditMode ? 'Editar Servicio' : 'Nuevo Servicio' }}
  </h2>

  <mat-dialog-content>
    <form [formGroup]="servicioForm">
      <mat-form-field appearance="outline">
        <mat-label>Nombre</mat-label>
        <input matInput formControlName="nombre" placeholder="Ej: Consulta veterinaria">
        <mat-icon matPrefix>medical_services</mat-icon>
        <mat-error *ngIf="servicioForm.get('nombre')?.invalid">
          {{ getErrorMessage('nombre') }}
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Precio</mat-label>
        <input matInput type="number" formControlName="precio" placeholder="0.00" step="0.01">
        <span matTextPrefix>{{ simboloMoneda }}&nbsp;</span>
        <mat-error *ngIf="servicioForm.get('precio')?.invalid">
          {{ getErrorMessage('precio') }}
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Categoría</mat-label>
        <input matInput formControlName="categoria" placeholder="Opcional">
        <mat-icon matPrefix>category</mat-icon>
        <mat-error *ngIf="servicioForm.get('categoria')?.invalid">
          {{ getErrorMessage('categoria') }}
        </mat-error>
      </mat-form-field>

      <div class="toggle-field" *ngIf="isEditMode">
        <mat-slide-toggle formControlName="activo">
          Servicio Activo
        </mat-slide-toggle>
      </div>
    </form>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button 
      mat-button 
      (click)="onCancel()"
      [disabled]="loading">
      Cancelar
    </button>
    <button 
      mat-raised-button 
      color="primary" 
      (click)="onSubmit()"
      [disabled]="loading || servicioForm.invalid">
      <mat-spinner diameter="20" *ngIf="loading"></mat-spinner>
      <span *ngIf="!loading">{{ isEditMode ? 'Actualizar' : 'Crear' }}</span>
    </button>
  </mat-dialog-actions>
</div>
