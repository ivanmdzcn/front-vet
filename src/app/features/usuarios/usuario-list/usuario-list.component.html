<div class="usuario-list-container">
  <mat-card>
    <mat-card-header>
      <div class="header-content">
        <div class="title-section">
          <mat-icon class="title-icon">people</mat-icon>
          <h1>Usuarios del Sistema</h1>
        </div>
        <button 
          mat-raised-button 
          color="primary" 
          (click)="openCreateDialog()">
          <mat-icon>person_add</mat-icon>
          Nuevo Usuario
        </button>
      </div>
    </mat-card-header>

    <mat-card-content>
      <!-- Loading spinner -->
      <div class="loading-container" *ngIf="loading()">
        <mat-spinner></mat-spinner>
      </div>

      <!-- Tabla -->
      <div class="table-container" *ngIf="!loading()">
        <table mat-table [dataSource]="displayedUsuarios()" class="usuario-table">
          <!-- Username Column -->
          <ng-container matColumnDef="username">
            <th mat-header-cell *matHeaderCellDef>Usuario</th>
            <td mat-cell *matCellDef="let usuario">
              <div class="user-info">
                <mat-icon>account_circle</mat-icon>
                <span class="username">{{ usuario.username }}</span>
              </div>
            </td>
          </ng-container>

          <!-- Nombre Completo Column -->
          <ng-container matColumnDef="nombreCompleto">
            <th mat-header-cell *matHeaderCellDef>Nombre Completo</th>
            <td mat-cell *matCellDef="let usuario">{{ usuario.nombreCompleto }}</td>
          </ng-container>

          <!-- Email Column -->
          <ng-container matColumnDef="email">
            <th mat-header-cell *matHeaderCellDef>Email</th>
            <td mat-cell *matCellDef="let usuario">
              <div class="email-info" *ngIf="usuario.email">
                <mat-icon>email</mat-icon>
                {{ usuario.email }}
              </div>
              <span *ngIf="!usuario.email" class="no-data">-</span>
            </td>
          </ng-container>

          <!-- Rol Column -->
          <ng-container matColumnDef="rol">
            <th mat-header-cell *matHeaderCellDef>Rol</th>
            <td mat-cell *matCellDef="let usuario">
              <mat-chip [class]="getRolClass(usuario.rol)">
                {{ usuario.rol }}
              </mat-chip>
            </td>
          </ng-container>

          <!-- Estado Column -->
          <ng-container matColumnDef="estado">
            <th mat-header-cell *matHeaderCellDef>Estado</th>
            <td mat-cell *matCellDef="let usuario">
              <mat-chip [class]="usuario.activo ? 'estado-activo' : 'estado-inactivo'">
                {{ usuario.activo ? 'Activo' : 'Inactivo' }}
              </mat-chip>
            </td>
          </ng-container>

          <!-- Acciones Column -->
          <ng-container matColumnDef="acciones">
            <th mat-header-cell *matHeaderCellDef>Acciones</th>
            <td mat-cell *matCellDef="let usuario">
              <button 
                mat-icon-button 
                color="primary"
                (click)="openEditDialog(usuario)"
                matTooltip="Editar">
                <mat-icon>edit</mat-icon>
              </button>
              <button 
                mat-icon-button 
                color="warn"
                (click)="deleteUsuario(usuario)"
                matTooltip="Eliminar"
                [disabled]="usuario.username === 'admin'">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

          <!-- No data row -->
          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell no-data" [attr.colspan]="displayedColumns.length">
              <div class="no-data-message">
                <mat-icon>info</mat-icon>
                <p>No se encontraron usuarios</p>
              </div>
            </td>
          </tr>
        </table>

        <!-- Paginador -->
        <mat-paginator 
          [length]="totalItems"
          [pageSize]="pageSize"
          [pageSizeOptions]="[5, 10, 25, 50]"
          (page)="onPageChange($event)"
          showFirstLastButtons>
        </mat-paginator>
      </div>
    </mat-card-content>
  </mat-card>
</div>
